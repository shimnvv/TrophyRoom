<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Completion Tracker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0e1013;
      --surface: #15181e;
      --surface-hover: #1b1f27;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --text: #eef1f5;
      --text-muted: #8b93a1;
      --accent: #e5b567;
      --accent-bg: rgba(229, 181, 103, 0.10);
      --accent-border: rgba(229, 181, 103, 0.28);
      --danger: #e06c75;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px 14px 36px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    .app {
      max-width: 540px;
      margin: 0 auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1, h2, p {
      margin: 0;
    }

    .title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .muted {
      font-size: 13px;
      color: var(--text-muted);
    }

    .input {
      width: 100%;
      margin-top: 12px;
      padding: 11px 13px;
      font-size: 14px;
      color: var(--text);
      background: #101216;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .input:focus {
      border-color: rgba(238, 241, 245, 0.35);
    }

    .btn-primary {
      width: 100%;
      margin-top: 10px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 600;
      color: #111317;
      background: var(--text);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .btn-primary:hover {
      opacity: 0.92;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-ghost {
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: var(--border-strong);
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .avatar {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      object-fit: cover;
      background: #1e222a;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .profile-meta {
      flex: 1;
      min-width: 0;
    }

    .profile-name {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-id {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-tile {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      padding: 15px;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .stat-tile:hover {
      background: var(--surface-hover);
      border-color: var(--border-strong);
    }

    .stat-tile.active {
      border-color: rgba(238, 241, 245, 0.32);
    }

    .stat-tile.gold {
      background: var(--accent-bg);
      border-color: var(--accent-border);
    }

    .stat-tile.gold:hover {
      border-color: rgba(229, 181, 103, 0.45);
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .stat-tile.gold .stat-value {
      color: var(--accent);
    }

    .stat-caption {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .list-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 2px;
    }

    .list-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .game-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .game-thumb {
      width: 34px;
      height: 34px;
      border-radius: 7px;
      object-fit: cover;
      background: #1e222a;
      flex-shrink: 0;
    }

    .game-body {
      flex: 1;
      min-width: 0;
    }

    .game-name {
      font-size: 13.5px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 1px;
      font-variant-numeric: tabular-nums;
    }

    .tag-100 {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      padding: 3px 7px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .error {
      margin-top: 10px;
      font-size: 12.5px;
      color: var(--danger);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app stack">
    <!-- Экран привязки -->
    <section id="linkView" class="card">
      <h1 class="title">Привязка Steam</h1>
      <p class="muted" style="margin-top: 5px;">
        Укажите ссылку на профиль, кастомный ID или SteamID64. В настройках приватности Steam «Игровые детали» должны быть открыты.
      </p>
      <input
        id="steamInput"
        class="input"
        type="text"
        placeholder="steamcommunity.com/id/... или 7656119..."
      />
      <button id="linkBtn" class="btn-primary" onclick="linkSteam()">Подключить аккаунт</button>
      <div id="errorMsg" class="error"></div>
    </section>

    <!-- Экран профиля -->
    <section id="profileView" class="stack hidden">
      <div class="card profile-top">
        <img id="avatar" class="avatar" src="" alt="" />
        <div class="profile-meta">
          <div id="personaName" class="profile-name"></div>
          <div id="steamIdLabel" class="profile-id"></div>
        </div>
        <button class="btn-ghost" onclick="showLinkView()">Изменить</button>
      </div>

      <div class="stats">
        <button id="btnAll" class="stat-tile" onclick="toggleList('all')">
          <span id="totalCount" class="stat-value">0</span>
          <span class="stat-caption">Всего игр</span>
        </button>
        <button id="btn100" class="stat-tile gold" onclick="toggleList('100')">
          <span id="completedCount" class="stat-value">0</span>
          <span class="stat-caption">Игры на 100%</span>
        </button>
      </div>

      <div id="listContainer" class="stack hidden">
        <div class="list-bar">
          <span id="listTitle" class="list-title"></span>
          <button class="btn-ghost" onclick="hideList()">Скрыть</button>
        </div>
        <div id="gamesList" class="stack" style="gap: 8px;"></div>
      </div>
    </section>
  </div>

  <script>
    // Если раздаешь фронт и бэкенд с одного сервера, оставь window.location.origin.
    // Если фронт отдельно (например, Vercel), укажи сюда URL бэкенда: "https://your-api.onrender.com"
    const API_URL =
      window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
        ? "http://127.0.0.1:8000"
        : window.location.origin;

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor("#0e1013");
      if (tg.setBackgroundColor) tg.setBackgroundColor("#0e1013");
    }

    const tgUserId = tg?.initDataUnsafe?.user?.id || 10001;
    let currentProfile = null;
    let activeMode = null;

    function setError(text) {
      document.getElementById("errorMsg").textContent = text || "";
    }

    function showLinkView() {
      document.getElementById("profileView").classList.add("hidden");
      document.getElementById("linkView").classList.remove("hidden");
      setError("");
    }

    function renderProfile(data) {
      currentProfile = data;
      activeMode = null;

      document.getElementById("linkView").classList.add("hidden");
      document.getElementById("profileView").classList.remove("hidden");
      document.getElementById("listContainer").classList.add("hidden");
      document.getElementById("btnAll").classList.remove("active");
      document.getElementById("btn100").classList.remove("active");

      document.getElementById("avatar").src = data.avatar || "";
      document.getElementById("personaName").textContent = data.persona_name || "Player";
      document.getElementById("steamIdLabel").textContent = `SteamID · ${data.steam_id}`;
      document.getElementById("totalCount").textContent = data.total_games_count;
      document.getElementById("completedCount").textContent = data.completed_100_count;
    }

    async function linkSteam() {
      const inputEl = document.getElementById("steamInput");
      const btnEl = document.getElementById("linkBtn");
      const steamInput = inputEl.value.trim();

      setError("");
      if (!steamInput) {
        setError("Введите ссылку на профиль или SteamID.");
        return;
      }

      btnEl.disabled = true;
      btnEl.textContent = "Загрузка...";

      try {
        const res = await fetch(`${API_URL}/api/link-steam`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tg_id: tgUserId, steam_input: steamInput }),
        });
        const data = await res.json();
        if (!res.ok) {
          setError(data.detail || "Не удалось загрузить профиль.");
          return;
        }
        renderProfile(data);
      } catch {
        setError("Сервер недоступен. Проверьте подключение.");
      } finally {
        btnEl.disabled = false;
        btnEl.textContent = "Подключить аккаунт";
      }
    }

    function hideList() {
      activeMode = null;
      document.getElementById("listContainer").classList.add("hidden");
      document.getElementById("btnAll").classList.remove("active");
      document.getElementById("btn100").classList.remove("active");
    }

    function toggleList(mode) {
      if (!currentProfile) return;
      if (activeMode === mode) {
        hideList();
        return;
      }

      activeMode = mode;
      const is100 = mode === "100";
      const items = is100 ? currentProfile.completed_100_games : currentProfile.all_games;

      document.getElementById("btnAll").classList.toggle("active", !is100);
      document.getElementById("btn100").classList.toggle("active", is100);
      document.getElementById("listTitle").textContent = is100
        ? `Игры на 100% · ${items.length}`
        : `Все игры · ${items.length}`;

      const listEl = document.getElementById("gamesList");
      listEl.innerHTML = "";

      if (!items.length) {
        listEl.innerHTML = `<div class="card"><p class="muted">В этом списке пока нет игр.</p></div>`;
      } else {
        for (const g of items) {
          const achPart = g.total > 0 ? `${g.unlocked}/${g.total} ачивок` : "Без ачивок";
          const row = document.createElement("div");
          row.className = "game-item";
          row.innerHTML = `
            <img class="game-thumb" src="${g.icon_url}" alt="" onerror="this.style.display='none'" />
            <div class="game-body">
              <div class="game-name">${g.name}</div>
              <div class="game-sub">${g.playtime_hours} ч · ${achPart}</div>
            </div>
            ${g.is_100 ? `<span class="tag-100">100%</span>` : ""}
          `;
          listEl.appendChild(row);
        }
      }

      document.getElementById("listContainer").classList.remove("hidden");
    }

    (async function init() {
      try {
        const res = await fetch(`${API_URL}/api/profile/${tgUserId}`);
        if (res.ok) {
          const data = await res.json();
          renderProfile(data);
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
